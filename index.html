<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrap">
      <div id="startScreen" class="panel">
        <div class="title-wrap">
          <div class="title-glow">PONG</div>
        </div>

        <p>Choose a difficulty and start the match.</p>

        <div class="difficulty-row">
          <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
          <button class="difficulty-btn" data-difficulty="medium">Medium</button>
          <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>

        <button id="startBtn" class="primary-btn">Start Match</button>
      </div>

      <div id="gameContainer" class="game-container hidden">
        <div class="hud-row">
          <div class="best-score">Best: <span id="bestScore">0</span></div>
          <div class="status" id="statusText">Running</div>
        </div>

        <div class="scoreboard">
          <div class="score" id="leftScore">0</div>
          <div class="divider">:</div>
          <div class="score" id="rightScore">0</div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <div class="game-actions">
          <button id="pauseBtn" class="secondary-btn">Pause</button>
          <button id="menuBtn" class="secondary-btn">Menu</button>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 id="winnerText">Player Wins!</h2>
          <div class="overlay-actions">
            <button id="playAgainBtn" class="primary-btn">Play Again</button>
            <button id="overlayMenuBtn" class="secondary-btn">Main Menu</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
