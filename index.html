<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: rgb(17, 24, 39);
        color: #f9fafb;
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .scoreboard {
        width: 800px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 18px;
        font-size: 2.5rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: #e5e7eb;
      }

      .score {
        min-width: 70px;
        text-align: center;
      }

      .divider {
        opacity: 0.8;
      }

      canvas {
        display: block;
        width: 800px;
        height: 500px;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        border: 4px solid #f9fafb;
        border-radius: 14px;
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
        cursor: none;
      }

      .start-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 800px;
        height: 500px;
        background: rgba(15, 23, 42, 0.9);
        border: 4px solid #f9fafb;
        border-radius: 14px;
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      .start-screen h1 {
        margin: 0 0 16px;
        font-size: 4rem;
      }

      .start-screen p {
        margin: 0 0 24px;
        font-size: 1.2rem;
      }

      .control-buttons {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .control-btn,
      .reset-btn {
        padding: 12px 22px;
        font-size: 1rem;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #f9fafb;
        color: #111827;
        transition: transform 0.15s ease;
      }

      .control-btn:hover,
      .reset-btn:hover {
        transform: translateY(-2px);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div id="startScreen" class="start-screen">
        <h1>🎮 PONG</h1>
        <p>Choose your control method:</p>
        <div class="control-buttons">
          <button id="mouseBtn" class="control-btn">🖱️ Mouse Control</button>
          <button id="keyboardBtn" class="control-btn">⌨️ Arrow Keys</button>
        </div>
      </div>

      <div id="gameContainer" class="game-container hidden">
        <div class="scoreboard">
          <div class="score" id="leftScore">0</div>
          <div class="divider">:</div>
          <div class="score" id="rightScore">0</div>
        </div>

        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <button id="resetBtn" class="reset-btn">Reset Game</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
